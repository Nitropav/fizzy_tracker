default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "fizzy_development") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CABLE_DB", "fizzy_development_cable") %>
    migrations_paths: db/cable_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CACHE_DB", "fizzy_development_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_QUEUE_DB", "fizzy_development_queue") %>
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "fizzy_test") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_CABLE_DB", "fizzy_test_cable") %>
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_PRODUCTION_DB", "fizzy_production") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_PRODUCTION_CABLE_DB", "fizzy_production_cable") %>
    migrations_paths: db/cable_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_PRODUCTION_CACHE_DB", "fizzy_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_PRODUCTION_QUEUE_DB", "fizzy_production_queue") %>
    migrations_paths: db/queue_migrate
