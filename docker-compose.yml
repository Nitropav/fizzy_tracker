services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_ADMIN_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_ADAPTER: postgres
      BUNDLE_PATH: /usr/local/bundle
      SOLID_QUEUE_IN_PUMA: "false"
      RUN_DB_SEED: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fizzy_development}
      POSTGRES_CABLE_DB: ${POSTGRES_CABLE_DB:-fizzy_development_cable}
      POSTGRES_CACHE_DB: ${POSTGRES_CACHE_DB:-fizzy_development_cache}
      POSTGRES_QUEUE_DB: ${POSTGRES_QUEUE_DB:-fizzy_development_queue}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-fizzy_test}
      POSTGRES_TEST_CABLE_DB: ${POSTGRES_TEST_CABLE_DB:-fizzy_test_cable}
    ports:
      - "3006:3006"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3006/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stdin_open: true
    tty: true

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_ADAPTER: postgres
      BUNDLE_PATH: /usr/local/bundle
      RUN_DB_SEED: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fizzy_development}
      POSTGRES_CABLE_DB: ${POSTGRES_CABLE_DB:-fizzy_development_cable}
      POSTGRES_CACHE_DB: ${POSTGRES_CACHE_DB:-fizzy_development_cache}
      POSTGRES_QUEUE_DB: ${POSTGRES_QUEUE_DB:-fizzy_development_queue}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-fizzy_test}
      POSTGRES_TEST_CABLE_DB: ${POSTGRES_TEST_CABLE_DB:-fizzy_test_cable}
    command: ["./bin/jobs", "start"]
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    stdin_open: true
    tty: true

volumes:
  bundle:
  postgres_data:
